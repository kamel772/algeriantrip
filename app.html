<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MostaTrip • Mostaganem</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C8785A">

    <!-- ===== COMPTEUR DE VISITES GOATCOUNTER ===== -->
    <script data-goatcounter="https://kamel772.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</head>
<body class="theme-boho-plage">
    <div class="app-container">
        <header class="header">
            <div class="lang-selector">
                <button data-lang="ar">AR</button>
                <button data-lang="fr">FR</button>
                <button data-lang="en">EN</button>
            </div>
            <h1 id="appTitle">MostaTrip</h1>
            <div style="display:flex; align-items:center;">
                <button id="darkModeToggle" class="dark-toggle" title="Mode sombre">
                <a href="dashboard.html" target="_blank" style="color:white; text-decoration:none; margin-right:10px; font-size:1.2rem;" title="Tableau de bord">📊</a>    
                    <svg id="darkIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="filter-toggle" id="filterToggle">☰</button>
            </div>
        </header>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Rechercher un lieu...">
        </div>

        <div id="weatherWidget" style="text-align:center; padding:8px; background:#e3f2fd; font-size:0.9rem; border-bottom:1px solid #bbdefb;">
            ☀️ Chargement météo...
        </div>

        <div id="advancedFilters" style="display:none; padding:10px 16px; background:#fafafa; border-bottom:1px solid #eee; gap:10px; overflow-x:auto;">
            <select id="filterStars" style="padding:8px; border-radius:20px; border:1px solid #ddd;">
                <option value="">⭐ Toutes étoiles</option>
                <option value="5">5 étoiles</option>
                <option value="4">4 étoiles</option>
                <option value="3">3 étoiles</option>
                <option value="2">2 étoiles</option>
                <option value="1">1 étoile</option>
            </select>
            <select id="filterWifi" style="padding:8px; border-radius:20px; border:1px solid #ddd;">
                <option value="">📶 Wifi</option>
                <option value="oui">Avec Wifi</option>
            </select>
            <select id="filterPool" style="padding:8px; border-radius:20px; border:1px solid #ddd;">
                <option value="">🏊 Piscine</option>
                <option value="oui">Avec piscine</option>
            </select>
        </div>

        <div class="category-filters" id="categoryFilters">
            <button class="cat-btn active" data-cat="site" title="Sites historiques">🏛️</button>
            <button class="cat-btn" data-cat="hebergement" title="Hébergements">🛏️</button>
            <button class="cat-btn" data-cat="artisan" title="Artisans">🎨</button>
            <button class="cat-btn" data-cat="loisirs" title="Loisirs">🎢</button>
            <button class="cat-btn" data-cat="culture" title="Culture">🎭</button>
            <button class="cat-btn" data-cat="nature" title="Nature">🌲</button>
            <button class="cat-btn" data-cat="restaurant" title="Restaurants">🍽️</button>
            <button class="cat-btn" data-cat="administration" title="Administrations">🏢</button>
            <button class="cat-btn" data-cat="services" title="Services">🛡️</button>
            <button class="cat-btn" data-cat="banque" title="Banques">🏦</button>
        </div>

        <div class="places-list" id="placesList"></div>

        <div class="modal" id="detailModal">
            <div class="modal-content">
                <span class="close-modal" id="closeDetailModal">&times;</span>
                <h2 id="detailName"></h2>
                <span id="detailCategory" class="badge"></span>
                <div id="detailDesc"></div>
                <div id="detailAddress" class="detail-address"></div>
                <div class="gallery-container" id="detailGallery"></div>
                <div class="detail-actions">
                    <button id="detailItineraire" class="btn-secondary">Itinéraire</button>
                    <button id="detailGuide" class="btn-secondary" style="display:none;">Guide</button>
                    <button id="detailVTC" class="btn-primary" style="display:none;">VTC</button>
                    <button id="detailAction" class="btn-primary">Réserver</button>
                </div>
            </div>
        </div>

        <div class="modal" id="bookingModal">
            <div class="modal-content">
                <span class="close-modal" id="closeBookingModal">&times;</span>
                <h2>Réservation pour <span id="bookingPlaceName"></span></h2>
                <form id="bookingForm">
                    <input type="text" name="name" placeholder="Votre nom" required>
                    <input type="email" name="email" placeholder="Votre email" required>
                    <input type="tel" name="phone" placeholder="Téléphone">
                    <input type="date" name="date">
                    <textarea name="message" placeholder="Message (optionnel)" rows="3"></textarea>
                    <button type="submit" class="btn-primary">Envoyer</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Chargement des scripts métier -->
    <script src="places.js"></script>
    <script src="main.js"></script>
    <script src="booking.js"></script>

    <!-- EmailJS (chargement asynchrone) -->
    <script>
        (function() {
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js';
            s.async = true;
            document.head.appendChild(s);
        })();
    </script>

    <!-- Enregistrement du Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(function(registration) {
                    console.log('✅ Service Worker enregistré avec succès :', registration.scope);
                })
                .catch(function(error) {
                    console.warn('⚠️ Service Worker non enregistré :', error);
                });
        }
    </script>
</body>
</html>
